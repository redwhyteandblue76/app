<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Austin Whyte</title><link rel="stylesheet" href="site-footer.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101215;color:#e9e9e9;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:650px;margin:45px auto 70px;padding:0 22px}h1{font-size:2rem;margin-bottom:5px}p{color:#bec4ca}a{color:#8ecbe8}label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}input,select,textarea{width:100%;border:1px solid #414b55;border-radius:7px;padding:12px;font:inherit;background:#1b2026;color:#f2f2f2}textarea{resize:vertical}button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:7px;background:#5fb3d9;color:#07131a;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.note{font-size:12px;color:#9ba4ad}.back{font-size:14px}.hidden-field{position:absolute;left:-9999px}#status{min-height:25px;font-size:14px} 
</style></head><body><main><a class="back" href="games.html">← Games</a><h1>Contact the Developer</h1><p>Questions, feedback, bug reports, or copyright inquiries? Send a message below.</p>
<form id="contactForm" method="POST" target="contactResponse" novalidate>
<label for="name">Name</label><input id="name" name="name" maxlength="100" autocomplete="name" required>
<label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
<label for="subject">Subject</label><select id="subject" name="subject" required><option value="">Select a subject</option><option>General Inquiry</option><option>Game Feedback</option><option>Bug Report</option><option>Copyright / Permissions</option><option>Privacy / Data Removal</option><option>Other</option></select>
<label for="message">Message</label><textarea id="message" name="message" rows="6" maxlength="5000" required></textarea>
<div class="hidden-field" aria-hidden="true"><label for="website">Leave this blank</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<input type="hidden" name="formStarted" id="formStarted">
<button type="submit" id="sendButton" disabled>Send Message</button><p id="status" role="status" aria-live="polite"></p>
<p class="note">Your contact details are used to handle your inquiry. Please don't submit passwords or other sensitive information. See <a href="copyright.html">Copyright &amp; Usage</a> for privacy information.</p>
</form><iframe name="contactResponse" id="contactResponse" title="Contact form response" hidden></iframe></main><script src="site-footer.js" defer></script><script>
(function(){
const ENDPOINT='https://script.google.com/macros/s/AKfycbxf2xb2hhg27_szcr9KhQSKsEu7uadPEzmkfESR77qwzb40_0hfu7B-h4o3Wa1p1xB_/exec'; // Paste your deployed Google Apps Script /exec URL here after setup.
const form=document.getElementById('contactForm'),button=document.getElementById('sendButton'),status=document.getElementById('status'),frame=document.getElementById('contactResponse');
document.getElementById('formStarted').value=String(Date.now());
if(ENDPOINT){form.action=ENDPOINT;button.disabled=false}else{status.textContent='Contact form setup is in progress. Please check back soon.'}
let submitted=false;
form.addEventListener('submit',function(e){
if(!ENDPOINT){e.preventDefault();return}
if(!form.reportValidity()){e.preventDefault();return}
submitted=true;button.disabled=true;status.textContent='Sending your message…';
});
frame.addEventListener('load',function(){
if(!submitted)return;submitted=false;
status.textContent='Your request was submitted. If you do not receive a response, please try again later.';
form.reset();document.getElementById('formStarted').value=String(Date.now());button.disabled=false;
});
})();
</script></body></html>
