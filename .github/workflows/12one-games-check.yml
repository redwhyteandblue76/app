name: 12ONE Games validation
on:
  push:
    branches: [host-original-game-pages-foundation]
  pull_request:
    paths:
      - 'assassins2.html'
      - 'mafia2.html'
      - 'host.html'
      - '12one-games/**'
      - '.github/workflows/12one-games-check.yml'
jobs:
  static-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: games_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and integration references
        run: node 12one-games/tests/validate.cjs
      - name: Install PostgreSQL SQL parser
        run: python -m pip install pglast
      - name: Parse new SQL migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for name in ['008_assassins_v2_public.sql','009_assassins_host_parity.sql','010_mafia_game.sql','011_settings_parity.sql','012_mafia_settings_parity.sql','013_player_recovery.sql','014_player_pin_login.sql','production_upgrade_008_to_014.sql']:
              file=Path('12one-games/sql')/name
              parse_sql(file.read_text())
              print('PASS', file)
          PY
      - name: Run disposable PostgreSQL game RPC tests
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -d games_test -v ON_ERROR_STOP=1 -f 12one-games/tests/base_fixture.sql
          for file in 008_assassins_v2_public.sql 009_assassins_host_parity.sql 010_mafia_game.sql 011_settings_parity.sql 012_mafia_settings_parity.sql 013_player_recovery.sql 014_player_pin_login.sql; do
            psql -h localhost -U postgres -d games_test -v ON_ERROR_STOP=1 -f "12one-games/sql/$file"
          done
          psql -h localhost -U postgres -d games_test -v ON_ERROR_STOP=1 -f 12one-games/tests/smoke.sql
          psql -h localhost -U postgres -d games_test -v ON_ERROR_STOP=1 -f 12one-games/tests/pin_login_smoke.sql
