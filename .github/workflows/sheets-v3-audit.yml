name: Sheets v3 audit regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check 12one-games/sheets-v3/app.js
      - run: node --check 12one-games/sheets-v3/api.js
      - run: node 12one-games/sheets-v3/tests.cjs
      - run: node 12one-games/sheets-v3/transport.test.cjs
